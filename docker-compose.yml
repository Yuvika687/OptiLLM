services:
  postgres:
    image: postgres:16-alpine
    container_name: optillm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optillm
      POSTGRES_PASSWORD: optillm_dev
      POSTGRES_DB: optillm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optillm"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
